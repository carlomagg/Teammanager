{% extends 'base.html' %}

{% block title %}{{ action }} Category{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row mb-4">
        <div class="col-12">
            <h2>{{ action }} Category</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{% url 'home' %}">Home</a></li>
                    <li class="breadcrumb-item"><a href="{% url 'leave:dashboard' %}">Leave</a></li>
                    <li class="breadcrumb-item"><a href="{% url 'leave:categories' %}">Categories</a></li>
                    <li class="breadcrumb-item active">{{ action }}</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_name" class="form-label">Category Name</label>
                            {{ form.name }}
                            {% if form.name.errors %}<div class="text-danger">{{ form.name.errors }}</div>{% endif %}
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">{{ action }}</button>
                            <a href="{% url 'leave:categories' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
