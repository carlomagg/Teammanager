<style>
  :root {
    /* surfaces */
    --pg-page-bg: #f0f2f5;
    --pg-card-bg: #ffffff;
    --pg-card-border: rgba(0, 0, 0, 0.07);
    --pg-card-shadow:
      0 1px 3px rgba(0, 0, 0, 0.06), 0 4px 14px rgba(0, 0, 0, 0.04);

    /* text */
    --pg-text-primary: #111827;
    --pg-text-secondary: #4b5563;
    --pg-text-muted: #9ca3af;
    --pg-divider: #e5e7eb;
    --pg-icon: #9ca3af;

    /* buttons */
    --pg-btn-border: #d1d5db;
    --pg-btn-text: #374151;
    --pg-btn-hover-bg: #f3f4f6;
    --pg-btn-hover-border: #9ca3af;
    --pg-btn-hover-text: #111827;

    /* info rows */
    --pg-info-hover: #f9fafb;

    /* completion — in progress */
    --pg-cp-bg: #eff6ff;
    --pg-cp-border: #bfdbfe;
    --pg-cp-label: #1d4ed8;
    --pg-cp-track: #dbeafe;
    --pg-cp-hint: #3b82f6;

    /* completion — done */
    --pg-cd-bg-start: #ecfdf5;
    --pg-cd-bg-end: #d1fae5;
    --pg-cd-border: #6ee7b7;
    --pg-cd-icon: #059669;
    --pg-cd-title: #065f46;
    --pg-cd-sub: #047857;

    /* QR */
    --pg-qr-bg: #f9fafb;
    --pg-qr-border: #e5e7eb;
    --pg-qr-text: #6b7280;
    --pg-qr-link: #1d4ed8;

    /* photo edit overlay */
    --pg-pe-bg: rgba(255, 255, 255, 0.9);
    --pg-pe-color: #374151;
    --pg-pe-hover-bg: #111827;
    --pg-pe-hover-color: #ffffff;
  }

  [data-bs-theme="dark"] {
    /* surfaces */
    --pg-page-bg: #0d0f16;
    --pg-card-bg: #161922;
    --pg-card-border: rgba(255, 255, 255, 0.07);
    --pg-card-shadow:
      0 1px 4px rgba(0, 0, 0, 0.5), 0 6px 24px rgba(0, 0, 0, 0.35);

    /* text */
    --pg-text-primary: #f1f5f9;
    --pg-text-secondary: #94a3b8;
    --pg-text-muted: #64748b;
    --pg-divider: #1e2433;
    --pg-icon: #64748b;

    /* buttons */
    --pg-btn-border: #2d3a4f;
    --pg-btn-text: #cbd5e1;
    --pg-btn-hover-bg: #1e2433;
    --pg-btn-hover-border: #475569;
    --pg-btn-hover-text: #f1f5f9;

    /* info rows */
    --pg-info-hover: #1a1f2e;

    /* completion — in progress */
    --pg-cp-bg: #0f172a;
    --pg-cp-border: #1e3a8a;
    --pg-cp-label: #93c5fd;
    --pg-cp-track: #1e3a8a;
    --pg-cp-hint: #60a5fa;

    /* completion — done */
    --pg-cd-bg-start: #022c22;
    --pg-cd-bg-end: #064e3b;
    --pg-cd-border: #065f46;
    --pg-cd-icon: #34d399;
    --pg-cd-title: #6ee7b7;
    --pg-cd-sub: #34d399;

    /* QR */
    --pg-qr-bg: #0f1117;
    --pg-qr-border: #1e2433;
    --pg-qr-text: #64748b;
    --pg-qr-link: #60a5fa;

    /* photo edit overlay */
    --pg-pe-bg: rgba(0, 0, 0, 0.7);
    --pg-pe-color: #cbd5e1;
    --pg-pe-hover-bg: #f1f5f9;
    --pg-pe-hover-color: #111827;
  }

  /* ================================================================
   TRANSITIONS — smooth theme switch on everything
================================================================ */
  .linkedin-profile *,
  .linkedin-profile *::before,
  .linkedin-profile *::after {
    transition:
      background-color 0.22s ease,
      border-color 0.22s ease,
      color 0.22s ease,
      box-shadow 0.22s ease;
  }

  /* ================================================================
   PAGE BACKGROUND
================================================================ */
  body {
    background-color: var(--pg-page-bg) !important;
  }

  /* ================================================================
   CARD
================================================================ */
  .linkedin-profile .card {
    background: var(--pg-card-bg) !important;
    border: 1px solid var(--pg-card-border) !important;
    border-radius: 1rem;
    box-shadow: var(--pg-card-shadow) !important;
    overflow: hidden;
  }

  /* Specific override for the left-sidebar profile card to ensure photo is flush */
  .linkedin-profile .card.profile-card {
    padding: 0 !important;
  }

  /* Ensure the container is exactly 300px and has no internal gaps */
  .linkedin-profile .profile-photo-container {
    position: relative;
    width: 100%;
    height: 300px;
    overflow: hidden;
    background-color: #000; /* deep black for gaps if any */
    margin: 0 !important;
    padding: 0 !important;
    border-radius: 1rem 1rem 0 0;
  }

  /* Force the image to cover every pixel of the container without distortion or margins */
  .linkedin-profile .profile-photo-container .profile-photo {
    width: 100% !important;
    height: 100% !important;
    min-width: 100% !important;
    min-height: 100% !important;
    object-fit: cover !important;
    object-position: center 15% !important; /* focused on likely face area */
    display: block !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    transition: transform 0.35s ease !important;
  }
  .profile-photo-container:hover .profile-photo {
    transform: scale(1.03);
  }

  /* Initials fallback — fills the container when no photo is uploaded */
  .profile-photo-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: #ffffff;
    border-radius: 1rem 1rem 0 0;
    user-select: none;
  }

  [data-bs-theme="dark"] .profile-photo-placeholder {
    background: linear-gradient(135deg, #312e81 0%, #4c1d95 100%);
  }

  .photo-edit-btn {
    position: absolute;
    bottom: 12px;
    right: 12px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--pg-pe-bg);
    color: var(--pg-pe-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.74rem;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }
  .photo-edit-btn:hover {
    background: var(--pg-pe-hover-bg);
    color: var(--pg-pe-hover-color);
  }

  /* ================================================================
   NAME & TITLE
================================================================ */
  .profile-name {
    font-size: 1.35rem;
    color: var(--pg-text-primary);
    line-height: 1.2;
    letter-spacing: -0.015em;
  }
  .profile-title {
    font-size: 0.86rem;
    color: var(--pg-text-secondary);
    font-weight: 500;
  }

  /* ================================================================
   ACTION BUTTONS
================================================================ */
  .action-row {
    flex-wrap: wrap;
  }

  .btn-action-outline {
    background: transparent;
    color: var(--pg-btn-text);
    border: 1.5px solid var(--pg-btn-border);
    border-radius: 2rem;
    padding: 0.4rem 1.05rem;
    font-size: 0.83rem;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
  }
  .btn-action-outline:hover {
    background: var(--pg-btn-hover-bg);
    border-color: var(--pg-btn-hover-border);
    color: var(--pg-btn-hover-text);
  }

  .btn-action-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--pg-btn-border);
    background: transparent;
    color: var(--pg-text-secondary);
    font-size: 0.82rem;
    flex-shrink: 0;
    text-decoration: none;
  }
  .btn-action-icon:hover {
    background: var(--pg-btn-hover-bg);
    border-color: var(--pg-btn-hover-border);
    color: var(--pg-btn-hover-text);
  }

  /* ================================================================
   INFO / CONTACT BLOCK
================================================================ */
  .info-block {
    border-top: 1px solid var(--pg-divider);
    border-bottom: 1px solid var(--pg-divider);
    padding: 0.7rem 0;
  }
  .info-row {
    display: flex;
    align-items: flex-start;
    gap: 0.65rem;
    padding: 0.3rem 0.4rem;
    font-size: 0.84rem;
    color: var(--pg-text-secondary);
    border-radius: 0.4rem;
  }
  .info-row:hover {
    background: var(--pg-info-hover);
  }
  .info-icon {
    color: var(--pg-icon);
    width: 14px;
    flex-shrink: 0;
    margin-top: 2px;
    text-align: center;
  }
  .info-text {
    line-height: 1.45;
    word-break: break-word;
  }

  /* ================================================================
   PROFILE COMPLETION — in progress
================================================================ */
  .completion-block {
    background: var(--pg-cp-bg);
    border: 1px solid var(--pg-cp-border);
    border-radius: 0.8rem;
    padding: 0.9rem 1rem;
  }
  .completion-label,
  .completion-pct {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--pg-cp-label);
  }
  .completion-track {
    height: 6px;
    background: var(--pg-cp-track);
    border-radius: 99px;
    overflow: hidden;
  }
  .completion-fill {
    height: 100%;
    background: linear-gradient(90deg, #3b82f6 0%, #10b981 100%);
    border-radius: 99px;
    transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1) !important;
  }
  .completion-hint {
    font-size: 0.76rem;
    color: var(--pg-cp-hint);
    line-height: 1.4;
  }

  /* ================================================================
   PROFILE COMPLETION — done
================================================================ */
  .completion-done {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: linear-gradient(
      135deg,
      var(--pg-cd-bg-start) 0%,
      var(--pg-cd-bg-end) 100%
    );
    border: 1px solid var(--pg-cd-border);
    border-radius: 0.8rem;
    padding: 0.85rem 1rem;
  }
  .completion-done-icon {
    font-size: 1.55rem;
    color: var(--pg-cd-icon);
    flex-shrink: 0;
    line-height: 1;
  }
  .completion-done-title {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--pg-cd-title);
  }
  .completion-done-sub {
    font-size: 0.76rem;
    color: var(--pg-cd-sub);
    margin-top: 2px;
    line-height: 1.35;
  }

  /* ================================================================
   QR ROW
================================================================ */
  .qr-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    border: 1px solid var(--pg-qr-border);
    border-radius: 0.8rem;
    padding: 0.8rem;
    background: var(--pg-qr-bg);
  }
  .qr-img {
    border-radius: 0.45rem;
    flex-shrink: 0;
  }
  .qr-info {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  .qr-title {
    font-size: 0.79rem;
    color: var(--pg-qr-text);
    font-weight: 500;
  }
  .qr-download-link {
    font-size: 0.79rem;
    color: var(--pg-qr-link);
    text-decoration: none;
    font-weight: 600;
  }
  .qr-download-link:hover {
    text-decoration: underline;
  }

  /* ================================================================
   RIGHT PANEL — override Bootstrap internals for dark mode
================================================================ */
  /* .btn-light (edit/add buttons in right panel) */
  [data-bs-theme="dark"] .linkedin-profile .btn-light {
    background-color: #1e2433 !important;
    border-color: #2d3a4f !important;
    color: #94a3b8 !important;
  }
  [data-bs-theme="dark"] .linkedin-profile .btn-light:hover {
    background-color: #252d42 !important;
    color: #f1f5f9 !important;
  }

  /* Education/Experience icon boxes */
  [data-bs-theme="dark"] .linkedin-profile .bg-light {
    background-color: #1a1f2e !important;
  }

  /* Borders inside right cards */
  [data-bs-theme="dark"] .linkedin-profile .border-bottom {
    border-color: var(--pg-divider) !important;
  }

  /* text-dark inside right panel (degree etc.) */
  [data-bs-theme="dark"] .linkedin-profile .text-dark {
    color: var(--pg-text-primary) !important;
  }

  .list-group-flush > .list-group-item:last-child {
    border-bottom: 0 !important;
  }

  /* ================================================================
   SECTION COMPLETENESS INDICATORS (owner-only)
================================================================ */

  /* Green — section has content */
  .section-complete {
    border-left: 4px solid #10b981 !important;
    border-radius: 0 1rem 1rem 0 !important;
  }

  /* Red — section is empty */
  .section-incomplete {
    border-left: 4px solid #ef4444 !important;
    border-radius: 0 1rem 1rem 0 !important;
  }

  /* Status dot pill shown in card header */
  .section-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.2rem 0.55rem;
    border-radius: 99px;
    white-space: nowrap;
    letter-spacing: 0.01em;
    transition: opacity 0.2s ease !important;
  }
  .section-status-badge.status-ok {
    background: #d1fae5;
    color: #065f46;
  }
  .section-status-badge.status-ok::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
    flex-shrink: 0;
  }
  .section-status-badge.status-missing {
    background: #fee2e2;
    color: #991b1b;
  }
  .section-status-badge.status-missing::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ef4444;
    flex-shrink: 0;
  }

  /* Dark mode overrides */
  [data-bs-theme="dark"] .section-complete {
    border-left-color: #34d399 !important;
  }
  [data-bs-theme="dark"] .section-incomplete {
    border-left-color: #f87171 !important;
  }
  [data-bs-theme="dark"] .section-status-badge.status-ok {
    background: rgba(52, 211, 153, 0.15);
    color: #6ee7b7;
  }
  [data-bs-theme="dark"] .section-status-badge.status-ok::before {
    background: #34d399;
  }
  [data-bs-theme="dark"] .section-status-badge.status-missing {
    background: rgba(248, 113, 113, 0.15);
    color: #fca5a5;
  }
  [data-bs-theme="dark"] .section-status-badge.status-missing::before {
    background: #f87171;
  }
</style>
