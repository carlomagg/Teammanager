<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true" style="z-index: 1060;">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 1.25rem; overflow: hidden;">
      <div class="modal-header bg-danger text-white border-0 py-3">
        <h5 class="modal-title fw-bold d-flex align-items-center" id="deleteModalTitle">
          <i class="fas fa-trash-alt me-2"></i> Confirm Deletion
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4 text-center">
        <div class="mb-4 mt-2">
          <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 rounded-circle" style="width: 80px; height: 80px;">
            <i class="fas fa-exclamation-triangle fa-3x text-danger animate__animated animate__pulse animate__infinite"></i>
          </div>
        </div>
        <h4 class="fw-bold text-dark mb-2" id="deleteModalHeading">Are you sure?</h4>
        <p class="text-muted px-2" id="deleteModalMessage">
          This action will permanently remove the item from your profile. This cannot be undone.
        </p>
      </div>
      <div class="modal-footer bg-light border-0 py-3 justify-content-center gap-2">
        <form method="post" id="deleteConfirmForm" class="d-flex gap-2 w-100 px-3">
          {% csrf_token %}
          <input type="hidden" name="action" id="deleteActionInput">
          <input type="hidden" name="item_id" id="deleteItemIdInput">
          <button type="button" class="btn btn-outline-secondary flex-grow-1 rounded-pill fw-semibold py-2" data-bs-dismiss="modal">
            No, Keep it
          </button>
          <button type="submit" class="btn btn-danger flex-grow-1 rounded-pill fw-bold py-2 shadow-sm">
            Yes, Delete
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<style>
  #deleteConfirmModal .animate__infinite {
    animation-iteration-count: infinite;
  }
  #deleteConfirmModal .btn-danger {
    transition: all 0.3s ease;
  }
  #deleteConfirmModal .btn-danger:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3) !important;
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const deleteModal = document.getElementById('deleteConfirmModal');
  if (deleteModal) {
    deleteModal.addEventListener('show.bs.modal', function (event) {
      const button = event.relatedTarget;
      const action = button.getAttribute('data-action');
      const itemId = button.getAttribute('data-id');
      const title = button.getAttribute('data-title') || 'Confirm Deletion';
      const heading = button.getAttribute('data-heading') || 'Are you sure?';
      const message = button.getAttribute('data-message') || 'This action cannot be undone.';
      const formAction = button.getAttribute('data-form-action');

      // Update the modal's content
      deleteModal.querySelector('#deleteModalTitle').innerHTML = `<i class="fas fa-trash-alt me-2"></i> ${title}`;
      deleteModal.querySelector('#deleteModalHeading').textContent = heading;
      deleteModal.querySelector('#deleteModalMessage').textContent = message;
      deleteModal.querySelector('#deleteActionInput').value = action;
      deleteModal.querySelector('#deleteItemIdInput').value = itemId;
      
      const form = deleteModal.querySelector('#deleteConfirmForm');
      if (formAction) {
          form.action = formAction;
      } else {
          // Default to current location if no specific action URL is provided
          form.action = window.location.href;
      }
    });
  }
});
</script>
