{% extends 'base.html' %}
{% load static %}
{% block title %}Edit Staff Profile - TeamManager{% endblock %}

{% block content %}
<div class="edit-staff-profile-page">
    <div class="profile-card">
        <div class="card-header">
            <h4 class="card-title mb-0">
                <i class="fas fa-building me-2 text-primary" aria-hidden="true"></i>
                Edit Staff Profile: {{ staff_profiles.name }}
            </h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    {{ form.as_p }}
                </div>
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i> Save
                        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>
                    {% if user.is_staff and not user.tenant %}
                        <button type="button" class="btn btn-secondary" onclick="history.back()" data-bs-toggle="tooltip" title="Return to previous page">
                            <i class="fas fa-arrow-left me-1"></i> Back
                        </button>
                    {% else %}
                        <a href="{% url 'staff_profile_list' %}" class="btn btn-secondary">
                            <i class="fas fa-times me-1"></i> Cancel
                        </a>
                    {% endif %}
                </div>
            </form>
        </div>
    </div>
</div>

<link rel="stylesheet" href="{% static 'css/edit_staff_profile.css' %}">
<script src="{% static 'js/edit_staff_profile.js' %}"></script>
{% endblock %}
